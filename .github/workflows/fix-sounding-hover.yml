name: Fix sounding hover

on:
  push:
    paths:
      - 'scripts/fix_sounding_hover.py'
      - '.github/workflows/fix-sounding-hover.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply sounding hover fix
        run: python scripts/fix_sounding_hover.py
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build plugin
        run: npm run build
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SoundingChart.svelte
          git commit -m "Fix sounding hover interaction"
          git push
