name: Apply v21 feature pack

on:
  push:
    paths:
      - 'scripts/apply_v21_ui.py'
      - '.github/workflows/apply-v21.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v21 UI
        run: python scripts/apply_v21_ui.py
      - name: Install dependencies
        run: npm install
      - name: Build plugin
        run: npm run build
      - name: Verify v21 version
        run: |
          grep -q '"version": "21.0.0"' package.json
          grep -q "version: '21.0.0'" src/pluginConfig.ts
      - name: Commit verified v21
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/plugin.svelte src/SnowlineChart.svelte src/SoundingChart.svelte src/displayUnits.ts src/eventOutlook.ts src/elevationOutlook.ts src/V21Panel.svelte src/pluginConfig.ts package.json README.md
          git commit -m "Release v21 feature-complete forecast"
          git push
