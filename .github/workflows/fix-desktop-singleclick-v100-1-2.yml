name: Fix desktop singleclick v100.1.2

on:
  push:
    paths:
      - 'scripts/fix_desktop_singleclick_v100_1_2.py'
      - '.github/workflows/fix-desktop-singleclick-v100-1-2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply desktop singleclick fix
        run: python scripts/fix_desktop_singleclick_v100_1_2.py
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build plugin
        run: npm run build
      - name: Verify version alignment
        run: |
          grep -q '"version": "100.1.2"' package.json
          grep -q "version: '100.1.2'" src/pluginConfig.ts
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/plugin.svelte package.json src/pluginConfig.ts
          git commit -m "Restrict native Windy picker after forecast close"
          git push
# trigger
