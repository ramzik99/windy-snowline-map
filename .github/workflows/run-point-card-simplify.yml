name: Simplify Wintry point card

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/simplify_point_card.py
      - run: rm -f tools/simplify_point_card.py .github/workflows/run-point-card-simplify.yml .github/point-card-trigger.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Simplify point card and keep detail in forecast window"
          git push
