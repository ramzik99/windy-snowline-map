name: v100 convenience

on:
  push:
    paths:
      - 'scripts/v100_convenience.py'
      - '.github/workflows/v100-convenience.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply v100 convenience changes
        run: python scripts/v100_convenience.py
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build plugin
        run: npm run build
      - name: Verify version alignment
        run: |
          grep -q '"version": "100.0.0"' package.json
          grep -q "version: '100.0.0'" src/pluginConfig.ts
      - name: Commit v100
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/plugin.svelte src/SnowlineChart.svelte src/SoundingChart.svelte src/PlaceSearch.svelte package.json src/pluginConfig.ts README.md
          git commit -m "Release convenience-first v100.0.0"
          git push
