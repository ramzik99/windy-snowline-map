name: Fix v100.0.1 UI

on:
  push:
    paths:
      - 'scripts/fix_v100_0_1_ui.py'
      - '.github/workflows/fix-v100-0-1-ui.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply point-card and sounding hover fixes
        run: python scripts/fix_v100_0_1_ui.py
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build plugin
        run: npm run build
      - name: Verify version alignment
        run: |
          grep -q '"version": "100.0.1"' package.json
          grep -q "version: '100.0.1'" src/pluginConfig.ts
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/plugin.svelte src/SoundingChart.svelte package.json src/pluginConfig.ts
          git commit -m "Fix point card and sounding hover in v100.0.1"
          git push
