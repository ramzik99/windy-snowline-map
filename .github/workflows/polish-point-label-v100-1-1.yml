name: Polish point label v100.1.1

on:
  push:
    paths:
      - 'scripts/polish_point_label_v100_1_1.py'
      - '.github/workflows/polish-point-label-v100-1-1.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply point-label polish
        run: python scripts/polish_point_label_v100_1_1.py
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build plugin
        run: npm run build
      - name: Verify version alignment
        run: |
          grep -q '"version": "100.1.1"' package.json
          grep -q "version: '100.1.1'" src/pluginConfig.ts
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/plugin.svelte package.json src/pluginConfig.ts
          git commit -m "Polish map label for v100.1.1"
          git push
