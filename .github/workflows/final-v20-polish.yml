name: Final v20 polish

on:
  push:
    paths:
      - 'scripts/final_v20_polish3.py'
      - '.github/workflows/final-v20-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final v20 polish
        run: python scripts/final_v20_polish3.py
      - name: Install dependencies
        run: npm install
      - name: Build plugin
        run: npm run build
      - name: Commit verified polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/plugin.svelte README.md
          git commit -m "Polish v20 point forecast experience"
          git push
