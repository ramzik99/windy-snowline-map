name: Simplify v21

on:
  push:
    paths:
      - 'scripts/simplify_v21.py'
      - '.github/workflows/simplify-v21.yml'

permissions:
  contents: write

jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply simplification
        run: python scripts/simplify_v21.py
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build plugin
        run: npm run build
      - name: Commit simplified plugin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/plugin.svelte src/SnowlineChart.svelte
          git commit -m "Simplify wintry forecast interface"
          git push
