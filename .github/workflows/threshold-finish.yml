name: Fix precipitation threshold visual

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/threshold-finish.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply threshold and version bump
        run: |
          python - <<'PY'
          from pathlib import Path
          chart = Path('src/SnowlineChart.svelte')
          s = chart.read_text().replace('class:wet={bar.mm >= 1}', 'class:wet={bar.mm >= PRECIP_THRESHOLD_MM_H}')
          chart.write_text(s)
          for file in ['src/pluginConfig.ts','package.json']:
              p=Path(file)
              p.write_text(p.read_text().replace('12.1.0','12.1.1'))
          Path('.github/workflows/threshold-finish.yml').unlink()
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix 0.1 mm/h threshold and release v12.1.1"
          git push
