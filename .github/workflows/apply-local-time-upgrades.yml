name: Apply local-time upgrades

on:
  push:
    paths:
      - '.github/workflows/apply-local-time-upgrades.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update forecast-time labels
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('src/SnowlineChart.svelte'): [
                  (
                      "function formatTooltipTime(time: number): string { const d = new Date(time); return `${d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric' })} ${String(d.getUTCHours()).padStart(2, '0')} UTC`; }",
                      "function formatTooltipTime(time: number): string { return new Date(time).toLocaleString(undefined, { weekday: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }",
                  ),
                  (
                      "function formatShortTime(time: number): string { const d = new Date(time); return `${d.toLocaleDateString(undefined, { weekday: 'short' })} ${String(d.getUTCHours()).padStart(2, '0')}Z`; }",
                      "function formatShortTime(time: number): string { return new Date(time).toLocaleString(undefined, { weekday: 'short', hour: '2-digit', minute: '2-digit' }); }",
                  ),
              ],
              Path('src/SoundingChart.svelte'): [
                  (
                      "const t = p.times[nearestIndex(p.times, target)], d = new Date(t);\n    return `${d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' })} · ${String(d.getUTCHours()).padStart(2, '0')} UTC`;",
                      "const t = p.times[nearestIndex(p.times, target)];\n    return new Date(t).toLocaleString(undefined, { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });",
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {path}: {old[:80]}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

      - name: Verify UTC usage is model-cycle only
        shell: bash
        run: |
          ! grep -n "getUTCHours.*UTC" src/SnowlineChart.svelte src/SoundingChart.svelte
          grep -n "function formatRun" src/SnowlineChart.svelte
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SnowlineChart.svelte src/SoundingChart.svelte
          git diff --cached --quiet && exit 0
          git commit -m "Use device local time for forecast labels"
          git push
