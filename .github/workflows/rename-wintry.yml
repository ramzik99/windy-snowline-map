name: Rename Wintry forecast UI

on:
  push:
    branches: [main]
    paths: ['.github/workflows/rename-wintry.yml']

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/plugin.svelte')
          s = p.read_text().replace('Snow forecast', 'Wintry forecast')
          p.write_text(s)
          Path('.github/workflows/rename-wintry.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename visible plugin UI to Wintry forecast"
          git push
