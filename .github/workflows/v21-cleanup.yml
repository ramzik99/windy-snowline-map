name: v21 cleanup

on:
  push:
    paths:
      - 'scripts/v21_final_cleanup.py'
      - '.github/workflows/v21-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final sounding cleanup
        run: python scripts/v21_final_cleanup.py
      - name: Install dependencies
        run: npm install
      - name: Build plugin
        run: npm run build
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SoundingChart.svelte
          git commit -m "Finalize v21 sounding interaction"
          git push
