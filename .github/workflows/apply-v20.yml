name: Apply v20 upgrade

on:
  push:
    paths:
      - 'scripts/apply_v20.py'
      - '.github/workflows/apply-v20.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v20 edits
        run: python scripts/apply_v20.py
      - name: Install dependencies
        run: npm install
      - name: Build v20
        run: npm run build
      - name: Verify aligned version
        run: |
          grep -q '"version": "20.0.0"' package.json
          grep -q "version: '20.0.0'" src/pluginConfig.ts
      - name: Commit verified v20
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/plugin.svelte src/SnowlineChart.svelte src/eventOutlook.ts src/pluginConfig.ts package.json README.md
          git commit -m "Release v20 event intelligence"
          git push
