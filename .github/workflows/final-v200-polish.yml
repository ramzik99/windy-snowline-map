name: Final v200 polish

on:
  push:
    paths:
      - 'scripts/final_v200_polish.py'
      - '.github/workflows/final-v200-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply v200 convenience polish
        run: python scripts/final_v200_polish.py
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build plugin
        run: npm run build
      - name: Verify version alignment
        run: |
          grep -q '"version": "200.0.0"' package.json
          grep -q "version: '200.0.0'" src/pluginConfig.ts
      - name: Commit v200
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/plugin.svelte src/PlaceSearch.svelte src/SnowlineChart.svelte src/SoundingChart.svelte src/V21Panel.svelte package.json src/pluginConfig.ts README.md
          git commit -m "Release v200 convenience freeze"
          git push
# trigger
